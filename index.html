<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoSecondsLater - Live Audio Delay</title>
    <meta name="description" content="Play the sounds with a 2-second delay">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #8b8ba7;
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 3rem;
        }

        .mic-button {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow:
                0 10px 40px rgba(102, 126, 234, 0.4),
                inset 0 -4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow:
                0 15px 50px rgba(102, 126, 234, 0.5),
                inset 0 -4px 20px rgba(0, 0, 0, 0.2);
        }

        .mic-button.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow:
                0 10px 40px rgba(245, 87, 108, 0.4),
                inset 0 -4px 20px rgba(0, 0, 0, 0.2);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 10px 40px rgba(245, 87, 108, 0.4);
            }

            50% {
                box-shadow: 0 10px 60px rgba(245, 87, 108, 0.6);
            }
        }

        .mic-icon {
            width: 60px;
            height: 60px;
            fill: white;
            transition: transform 0.3s ease;
        }

        .mic-button.active .mic-icon {
            transform: scale(1.1);
        }

        .status {
            font-size: 1.2rem;
            font-weight: 500;
            color: #a0a0c0;
            margin-bottom: 1rem;
            min-height: 1.5em;
        }

        .status.active {
            color: #f5576c;
        }

        .hint {
            color: #5a5a7a;
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* Audio visualizer rings */
        .rings {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(245, 87, 108, 0.3);
            border-radius: 50%;
            opacity: 0;
        }

        .mic-button.active .ring {
            animation: ripple 2s ease-out infinite;
        }

        .ring:nth-child(1) {
            animation-delay: 0s;
        }

        .ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .ring:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes ripple {
            0% {
                width: 160px;
                height: 160px;
                opacity: 0.6;
            }

            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }

        /* Error state */
        .error {
            color: #f5576c;
            background: rgba(245, 87, 108, 0.1);
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        /* Background decoration */
        .bg-blur {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        .bg-blur-1 {
            background: #667eea;
            top: -100px;
            right: -100px;
        }

        .bg-blur-2 {
            background: #764ba2;
            bottom: -100px;
            left: -100px;
        }
    </style>
</head>

<body>
    <div class="bg-blur bg-blur-1"></div>
    <div class="bg-blur bg-blur-2"></div>

    <div class="container">
        <div class="logo">🎤</div>
        <h1>TwoSecondsLater</h1>
        <p class="tagline">Play the sounds with a 2-second delay</p>

        <button class="mic-button" id="micButton">
            <div class="rings">
                <div class="ring"></div>
                <div class="ring"></div>
                <div class="ring"></div>
            </div>
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path
                    d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z" />
                <path
                    d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>

        <p class="status" id="status">Click to start</p>
        <p class="hint" id="hint">Sounds play with 2 second delay</p>

        <div id="error"></div>
    </div>

    <script>
        const micButton = document.getElementById('micButton');
        const statusEl = document.getElementById('status');
        const hintEl = document.getElementById('hint');
        const errorEl = document.getElementById('error');

        let audioContext = null;
        let mediaStream = null;
        let isListening = false;

        async function startListening() {
            try {
                // HIGH FIDELITY AUDIO CAPTURE
                // - Echo cancellation: prevents feedback loop (minimal quality impact)
                // - No noise suppression: captures all frequencies
                // - No auto gain: preserves natural dynamics
                // - High sample rate: captures full frequency range
                // - Stereo: captures spatial audio
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: false,
                        autoGainControl: false,
                        sampleRate: { ideal: 96000 },  // Studio quality (falls back to 48000)
                        sampleSize: { ideal: 24 },     // 24-bit audio
                        channelCount: { ideal: 2 }     // Stereo
                    }
                });

                // Create high-fidelity audio context
                // Use the highest sample rate the system supports
                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: 96000,  // Studio quality
                    latencyHint: 'playback'  // Prioritize quality over latency
                });

                // Create source from microphone
                const source = audioContext.createMediaStreamSource(mediaStream);

                // PURE 2-SECOND DELAY - no processing, exact reproduction
                const delayNode = audioContext.createDelay(5.0);
                delayNode.delayTime.value = 2.0;

                // Unity gain - no amplification, exact sound levels
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 1.0;

                // CLEAN SIGNAL PATH: microphone -> delay -> output
                // No compression, no limiting, no EQ - pure reproduction
                source.connect(delayNode);
                delayNode.connect(gainNode);
                gainNode.connect(audioContext.destination);

                isListening = true;
                micButton.classList.add('active');
                statusEl.textContent = 'Live • 2s delay';
                statusEl.classList.add('active');
                hintEl.textContent = 'Sounds play with 2 second delay';
                errorEl.innerHTML = '';

            } catch (err) {
                console.error('Error:', err);
                errorEl.innerHTML = `<div class="error">⚠️ Could not access microphone. Please allow microphone access and try again.</div>`;
            }
        }

        function stopListening() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }

            isListening = false;
            micButton.classList.remove('active');
            statusEl.textContent = 'Click to start';
            statusEl.classList.remove('active');
            hintEl.textContent = 'Sounds play with 2 second delay';
        }

        micButton.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isListening) {
                stopListening();
            }
        });
    </script>
</body>

</html>
